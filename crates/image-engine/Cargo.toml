[package]
name = "image-engine"
version = "0.6.0"
edition = "2021"
publish = false
description = "Browser-local photo processing for WASM Image Editor"
license = "MIT"
repository = "https://github.com/GaryJX/wasm-image-editor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.108"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Rust's release optimizations are sufficient for the initial small engine.
# Avoid an additional platform-specific Binaryen download during builds.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
