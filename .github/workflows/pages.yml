name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: still-photo-editor-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust and the WASM target
        run: rustup show active-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Test the engine and render scheduler
        run: |
          npm run test:rust
          npm test

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Build for the Pages URL
        run: npm run build
        env:
          APP_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Save the production build for browser checks
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist
          retention-days: 1

  browser-checks:
    needs: build
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the production build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist

      - name: Verify Chromium, Firefox, and WebKit
        run: npm run test:e2e
        env:
          APP_BASE_PATH: ${{ needs.build.outputs.base_path }}/

      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: browser-checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
