<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('still-theme'); } catch {}
        document.documentElement.dataset.theme = preference === 'dark' || preference === 'light'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    <meta name="description" content="A lightweight photo editor built directly into your browser." />
    <title>Still — Photo editor</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
